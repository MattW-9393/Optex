<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>OptEx | Workout Builder App</title>
</head>
<body>
    <h1>OptEx</h1>
    <h2>Workout || Build || Optimize</h2>
    <nav>
        <ul>
            <li><a href="#">About</a></li>
            <li><a href="#">Templates</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </nav>

    <h2>Workout Builder</h2>
    <div id="containerOne">
        <form action="">
            <div class="container">
                <label for="exercise">Add Excercise: </label>
                <input id="exercise" type="text">
             
            </div>
            <br>
            <div>
                <label for="reps">Add Reps: </label>
                <input id="reps" type="number" min="1" max="20">
           
            </div>
            <br>
            <div>
                <label for="sets">Add Sets: </label>
                <input id="sets" type="number" min="1" max="10">
            </div>
            <button id="addButton" type="button">Add</button>
     </form>
        <br>
    </div>

    <div class="container" id="containerTwo">
        <h2 id="currentWorkoutTitle">My Workout</h2>
        <table id="workoutTable">
            <tr class="tableHeadersTemplate">
                <th class="exTitleTableTemplate">Excercise</th>
                <th class="exSetsTableTemplate">Sets</th>
                <th class="exRepsTableTemplate">Reps</th>
                <th class="actionsField">Actions</th>
            </tr>
        </table>

        <button type="button" id="clearCurrentWorkoutBtn">Clear Current Workout</button>

        <div>
            <h2 id="saveh2">Great workout?</h2>
            <p>Store your workout as a template to reuse next time!</p>
            <form action="">
                <label for="templateNameForm">Template Name: </label>
                <input type="text" name="templateNameForm" id="templateNameForm">
                <button id="saveAsButton" type="button" >Save Workout</button>
            </form>
        </div>
    </div>

    <div>
        <h2>My Templates</h2>
        <div id="templateSection">
            <!-- All Template Cards will show here -->
        </div>
    </div>

    <div id="openTemplateTable">
        <!-- Templates will appear here when they are opened -->
    </div>
    <footer>
        <p id="copyright"></p>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
